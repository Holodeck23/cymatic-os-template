<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #333;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .quick-capture {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .quick-capture input {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            color: #e0e0e0;
            transition: all 0.2s;
        }

        .quick-capture input:focus {
            outline: none;
            border-color: #667eea;
            background: #222;
        }

        .quick-capture button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-capture button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 10px 20px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 20px;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .item-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.2s;
        }

        .item-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .item-category {
            font-size: 12px;
            padding: 4px 10px;
            background: #333;
            border-radius: 10px;
            color: #999;
        }

        .item-actions {
            display: flex;
            gap: 5px;
        }

        .item-actions button {
            padding: 5px 10px;
            background: transparent;
            border: 1px solid #444;
            border-radius: 5px;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .item-actions button:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .item-content {
            font-size: 15px;
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 10px;
            white-space: pre-wrap;
        }

        .item-content[contenteditable="true"] {
            background: #222;
            padding: 10px;
            border-radius: 8px;
            outline: none;
            border: 1px solid #444;
        }

        .item-content[contenteditable="true"]:focus {
            border-color: #667eea;
        }

        .item-meta {
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        .status {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 15px 20px;
            background: #1a1a1a;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .status-item label {
            font-size: 12px;
            color: #888;
            font-weight: 600;
        }

        .status-item input[type="number"],
        .status-item input[type="text"] {
            padding: 8px 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
            width: 80px;
        }

        .status-item input:focus {
            outline: none;
            border-color: #667eea;
        }

        .floating-chat {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
            z-index: 1000;
        }

        .floating-chat:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(102, 126, 234, 0.6);
        }

        .floating-chat span {
            font-size: 28px;
        }

        .chat-panel {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 400px;
            height: 500px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 15px;
            display: none;
            flex-direction: column;
            z-index: 999;
        }

        .chat-panel.open {
            display: flex;
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .chat-input {
            padding: 15px;
            border-top: 2px solid #333;
        }

        .chat-input input {
            width: 100%;
            padding: 12px 15px;
            background: #0a0a0a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #e0e0e0;
        }

        .search-bar {
            margin-bottom: 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 20px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 15px;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .items-grid {
                grid-template-columns: 1fr;
            }

            .chat-panel {
                width: calc(100vw - 40px);
                right: 20px;
            }

            .status {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌊 Life Dashboard</h1>
            <div style="font-size: 14px; color: #666;">
                <span id="itemCount">0</span> items | <span id="currentTime"></span>
            </div>
        </header>

        <!-- Quick Status (Editable) -->
        <div class="status">
            <div class="status-item">
                <label>Energy</label>
                <input type="number" id="energyInput" min="1" max="10" value="5"
                       onchange="updateStatus()">
            </div>
            <div class="status-item">
                <label>Stress</label>
                <input type="number" id="stressInput" min="1" max="10" value="5"
                       onchange="updateStatus()">
            </div>
            <div class="status-item">
                <label>Mood</label>
                <input type="text" id="moodInput" placeholder="How you feeling?"
                       onchange="updateStatus()">
            </div>
            <div class="status-item" style="flex: 1;">
                <label>Today's Focus</label>
                <input type="text" id="focusInput" placeholder="What's most important today?"
                       onchange="updateStatus()" style="width: 100%;">
            </div>
        </div>

        <!-- Search -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Search everything..."
                   oninput="searchItems()">
        </div>

        <!-- Quick Capture -->
        <div class="quick-capture">
            <input type="text" id="captureInput"
                   placeholder="Capture anything... (type and press Enter)"
                   onkeypress="handleCapture(event)">
            <button onclick="captureItem()">Add</button>
        </div>

        <!-- Categories -->
        <div class="categories">
            <button class="category-btn active" onclick="filterCategory('all')">All</button>
            <button class="category-btn" onclick="filterCategory('task')">Tasks</button>
            <button class="category-btn" onclick="filterCategory('client')">Clients</button>
            <button class="category-btn" onclick="filterCategory('recipe')">Recipes</button>
            <button class="category-btn" onclick="filterCategory('idea')">Ideas</button>
            <button class="category-btn" onclick="filterCategory('note')">Notes</button>
            <button class="category-btn" onclick="filterCategory('link')">Links</button>
        </div>

        <!-- Items Grid -->
        <div class="items-grid" id="itemsGrid">
            <div class="empty-state">
                <h3>Nothing here yet</h3>
                <p>Start capturing your thoughts, tasks, recipes, or anything else above!</p>
            </div>
        </div>
    </div>

    <!-- Floating Claude Chat -->
    <div class="floating-chat" onclick="toggleChat()">
        <span>🤖</span>
    </div>

    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <strong>Claude Assistant</strong>
            <button onclick="toggleChat()" style="background: transparent; border: none;
                   color: #888; cursor: pointer; font-size: 20px;">×</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <p style="color: #666; text-align: center; margin-top: 20px;">
                Ask me anything about your dashboard, life, or tasks!
            </p>
        </div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Ask Claude..."
                   onkeypress="handleChatEnter(event)">
        </div>
    </div>

    <script src="app-simple.js"></script>
</body>
</html>
